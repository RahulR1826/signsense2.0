# coturn configuration for SignSense (used by `docker compose --profile turn up`).
# Credentials: TURN REST API ("use-auth-secret"). The backend hands each call participant a username
# "<expiry>:<peer>" and an HMAC of it; the shared secret is passed on the command line from .env and is
# never sent to browsers. Credentials expire after TURN_TTL_S (default 1 hour).

listening-port=3478
tls-listening-port=5349
# Relay ports (open these UDP ports in the firewall, plus 3478 udp/tcp and 5349 tcp).
min-port=49160
max-port=49200

use-auth-secret
fingerprint
no-cli
no-multicast-peers
# Only relay real call traffic: TURN-over-TCP to peers isn't needed for WebRTC.
no-tcp-relay

# Never relay into private or special networks (stops the server being used to reach internal machines).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits per user / overall (a 1:1 video call needs a few Mbit/s).
user-quota=12
total-quota=600
max-bps=3000000

# For TLS (turns:), uncomment and point at your certificate files:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# If the server is behind NAT (e.g. a cloud VM), set its public address:
# external-ip=203.0.113.10

log-file=stdout
simple-log
